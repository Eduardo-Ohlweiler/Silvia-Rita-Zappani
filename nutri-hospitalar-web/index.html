<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nutri Hospitalar de Sucesso</title>
    <meta name="description" content="Calculadora nutricional hospitalar — UTI adulto e pediatria." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:title" content="Nutri Hospitalar de Sucesso" />
    <meta property="og:description" content="Calculadora nutricional hospitalar — UTI adulto e pediatria." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#FAF6FE" />

    <!--
      Aplica o tema antes do React montar, evitando o flash de cor errada.
      O padrão é CLARO — é o tema da marca. Não seguimos `prefers-color-scheme`:
      quem prefere o escuro alterna no header, e a escolha fica salva.
    -->
    <script>
      (function () {
        var salvo = localStorage.getItem('nutri-tema')
        var tema = salvo === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = tema
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', tema === 'dark' ? '#00091A' : '#FAF6FE')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
